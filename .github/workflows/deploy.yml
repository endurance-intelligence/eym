name: Deploy Endurance Intelligence to GitHub Pages

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    name: build
    runs-on: ubuntu-latest

    steps:
      - name: Repository laden
        uses: actions/checkout@v6

      - name: Node.js einrichten
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Code prüfen
        run: npm run lint

      - name: Anwendung bauen
        run: npm run build

      - name: Build-Ausgabe prüfen
        shell: bash
        run: |
          echo "Prüfe das dist-Verzeichnis..."

          if [ ! -d "./dist" ]; then
            echo "FEHLER: Das Verzeichnis ./dist wurde nicht erstellt."
            exit 1
          fi

          if [ ! -f "./dist/index.html" ]; then
            echo "FEHLER: Die Datei ./dist/index.html wurde nicht gefunden."
            exit 1
          fi

          echo "Build-Verzeichnis ist vorhanden."
          du -sh ./dist
          find ./dist -maxdepth 3 -type f | sort | sed -n '1,200p'

      - name: GitHub Pages konfigurieren
        uses: actions/configure-pages@v5

      - name: Build hochladen
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

  deploy:
    name: deploy
    runs-on: ubuntu-latest
    needs: build

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Festhängendes Pages-Deployment abbrechen
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          STALE_DEPLOYMENT_ID: cbb924cd1e6fc420fffebbbba7e789e93ed74331
        run: |
          echo "Prüfe das alte Pages-Deployment..."

          STATUS="$(gh api \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "repos/${GITHUB_REPOSITORY}/pages/deployments/${STALE_DEPLOYMENT_ID}" \
            --jq '.status' 2>/dev/null || true)"

          echo "Status: ${STATUS:-nicht gefunden}"

          if [ "$STATUS" = "deployment_in_progress" ] || \
             [ "$STATUS" = "deployment_queued" ]; then

            echo "Festhängendes Deployment wird abgebrochen..."

            gh api \
              --method POST \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2026-03-10" \
              "repos/${GITHUB_REPOSITORY}/pages/deployments/${STALE_DEPLOYMENT_ID}/cancel"

            echo "Altes Deployment wurde abgebrochen."
            sleep 10
          else
            echo "Kein festhängendes Deployment mehr vorhanden."
          fi

      - name: GitHub Pages veröffentlichen
        id: deployment
        uses: actions/deploy-pages@v4