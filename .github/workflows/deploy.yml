name: Deploy Endurance Intelligence to GitHub Pages

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    name: build
    runs-on: ubuntu-latest

    steps:
      - name: Repository laden
        uses: actions/checkout@v6

      - name: Node.js einrichten
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Code prüfen
        run: npm run lint

      - name: Anwendung bauen
        run: npm run build

      - name: Build-Ausgabe prüfen
        run: |
          echo "Prüfe dist-Verzeichnis..."

          if [ ! -d "./dist" ]; then
            echo "FEHLER: Das Verzeichnis ./dist wurde nicht erstellt."
            exit 1
          fi

          if [ ! -f "./dist/index.html" ]; then
            echo "FEHLER: ./dist/index.html wurde nicht gefunden."
            exit 1
          fi

          echo "Build-Verzeichnis vorhanden:"
          du -sh ./dist

          echo "Enthaltene Dateien:"
          find ./dist -maxdepth 3 -type f | sort | head -200

      - name: GitHub Pages konfigurieren
        uses: actions/configure-pages@v5

      - name: Build hochladen
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

  deploy:
    name: deploy
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 25

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: GitHub Pages veröffentlichen
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: 1200000