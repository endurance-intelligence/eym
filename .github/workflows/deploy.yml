name: Deploy Endurance Intelligence to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

# Es darf immer nur ein Pages-Deployment gleichzeitig laufen.
# Ein bereits laufendes Deployment wird nicht automatisch abgebrochen.
concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    name: build
    runs-on: ubuntu-latest

    steps:
      - name: Repository laden
        uses: actions/checkout@v6

      - name: Node.js einrichten
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Code prüfen
        run: npm run lint

      - name: Anwendung bauen
        run: npm run build

      - name: Build-Ausgabe prüfen
        shell: bash
        run: |
          echo "Prüfe das dist-Verzeichnis..."

          if [ ! -d "./dist" ]; then
            echo "FEHLER: Das Verzeichnis ./dist wurde nicht erstellt."
            exit 1
          fi

          if [ ! -f "./dist/index.html" ]; then
            echo "FEHLER: Die Datei ./dist/index.html wurde nicht gefunden."
            exit 1
          fi

          echo "Build-Verzeichnis ist vorhanden."
          echo "Größe des Builds:"
          du -sh ./dist

          echo "Dateien im Build:"
          find ./dist -maxdepth 3 -type f | sort | sed -n '1,200p'

      - name: GitHub Pages konfigurieren
        uses: actions/configure-pages@v6

      - name: Build hochladen
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  deploy:
    name: deploy
    runs-on: ubuntu-latest
    needs: build

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: GitHub Pages veröffentlichen
        id: deployment
        uses: actions/deploy-pages@v5